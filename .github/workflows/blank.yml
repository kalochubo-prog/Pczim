<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PC Virtual RTX 3060</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#07111f,#101b2d,#17263b);
    color:white;
}

/* DESKTOP */
.desktop{
    height:100vh;
    padding:25px;
    position:relative;
}

.logo{
    font-size:25px;
    font-weight:bold;
    margin-bottom:30px;
}

.icons{
    display:flex;
    flex-direction:column;
    gap:22px;
    width:90px;
}

.icon{
    width:75px;
    text-align:center;
    cursor:pointer;
    padding:8px;
    border-radius:8px;
}

.icon:hover{background:#ffffff18}

.icon .emoji{
    font-size:38px;
    display:block;
}

.icon span:last-child{
    font-size:13px;
}

/* JANELAS */
.window{
    position:absolute;
    width:650px;
    max-width:90%;
    height:420px;
    background:#111b2b;
    border:1px solid #394b66;
    border-radius:12px;
    box-shadow:0 20px 60px #0009;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    display:none;
    overflow:hidden;
}

.titlebar{
    height:45px;
    background:#1c2a40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    font-weight:bold;
}

.close{
    background:#e74c3c;
    border:0;
    color:white;
    width:28px;
    height:28px;
    border-radius:6px;
    cursor:pointer;
}

.content{
    padding:25px;
    height:calc(100% - 45px);
    overflow:auto;
}

/* START */
.start{
    position:absolute;
    bottom:65px;
    left:15px;
    width:350px;
    background:#101a2aee;
    backdrop-filter:blur(15px);
    border:1px solid #40516b;
    border-radius:14px;
    padding:20px;
    display:none;
}

.start h2{margin-bottom:15px}

.app{
    padding:14px;
    margin:7px 0;
    background:#ffffff0d;
    border-radius:8px;
    cursor:pointer;
}

.app:hover{background:#ffffff1c}

/* TASKBAR */
.taskbar{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:55px;
    background:#0a111dcc;
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:15px;
}

.startBtn{
    background:#1d6fe8;
    border:0;
    color:white;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:bold;
}

.clock{
    margin-left:auto;
    font-size:14px;
}

/* GPU */
.gpu{
    background:linear-gradient(135deg,#17283e,#0b1421);
    border:1px solid #415774;
    border-radius:15px;
    padding:25px;
}

.gpu h1{
    color:#7cc7ff;
    margin-bottom:10px;
}

.spec{
    margin:15px 0;
    background:#ffffff0a;
    padding:14px;
    border-radius:10px;
}

.bar{
    height:12px;
    background:#26364c;
    border-radius:10px;
    overflow:hidden;
    margin-top:7px;
}

.fill{
    height:100%;
    width:0%;
    background:#3498db;
    transition:width 1s;
}

button.action{
    border:0;
    background:#2675d8;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}

button.action:hover{background:#3488ed}

.files{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.file{
    padding:20px;
    background:#ffffff0b;
    border-radius:10px;
    text-align:center;
}

/* NAVEGADOR */
.search{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:1px solid #40516b;
    background:#0b1421;
    color:white;
    margin-bottom:15px;
}

.browserpage{
    background:#0b1421;
    min-height:250px;
    padding:25px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="desktop">

    <div class="logo">🖥️ PC VIRTUAL RTX 3060</div>

    <div class="icons">
        <div class="icon" onclick="openWindow('gpu')">
            <span class="emoji">🎮</span>
            GPU
        </div>

        <div class="icon" onclick="openWindow('files')">
            <span class="emoji">📁</span>
            Arquivos
        </div>

        <div class="icon" onclick="openWindow('browser')">
            <span class="emoji">🌐</span>
            Navegador
        </div>

        <div class="icon" onclick="openWindow('settings')">
            <span class="emoji">⚙️</span>
            Configurações
        </div>
    </div>

    <!-- GPU WINDOW -->
    <div class="window" id="gpu">
        <div class="titlebar">
            <span>🎮 NVIDIA RTX 3060</span>
            <button class="close" onclick="closeWindow('gpu')">×</button>
        </div>

        <div class="content">
            <div class="gpu">
                <h1>RTX 3060</h1>
                <p>GPU Virtual • Sistema de demonstração</p>

                <div class="spec">
                    <b>Uso da GPU</b>
                    <div class="bar">
                        <div class="fill" id="gpuFill"></div>
                    </div>
                    <span id="gpuText">0%</span>
                </div>

                <div class="spec">
                    <b>VRAM</b>
                    <div class="bar">
                        <div class="fill" id="vramFill"></div>
                    </div>
                    <span id="vramText">0 / 12 GB</span>
                </div>

                <div class="spec">
                    <b>Temperatura</b>
                    <p id="temp">35°C</p>
                </div>

                <button class="action" onclick="benchmark()">
                    🚀 Rodar Benchmark
                </button>
            </div>
        </div>
    </div>

    <!-- FILES -->
    <div class="window" id="files">
        <div class="titlebar">
            <span>📁 Explorador de Arquivos</span>
            <button class="close" onclick="closeWindow('files')">×</button>
        </div>

        <div class="content">
            <div class="files">
                <div class="file">📁 Documentos</div>
                <div class="file">📁 Downloads</div>
                <div class="file">📁 Jogos</div>
                <div class="file">🖼️ Imagens</div>
                <div class="file">🎬 Vídeos</div>
                <div class="file">🎵 Música</div>
            </div>
        </div>
    </div>

    <!-- BROWSER -->
    <div class="window" id="browser">
        <div class="titlebar">
            <span>🌐 Navegador Virtual</span>
            <button class="close" onclick="closeWindow('browser')">×</button>
        </div>

        <div class="content">
            <input
                class="search"
                id="search"
                placeholder="Digite uma pesquisa..."
                onkeydown="if(event.key==='Enter')searchWeb()"
            >

            <div class="browserpage" id="browserpage">
                <h1>🌐 Navegador</h1>
                <br>
                <p>PC Virtual RTX 3060</p>
                <p>Digite algo na barra acima e pressione Enter.</p>
            </div>
        </div>
    </div>

    <!-- SETTINGS -->
    <div class="window" id="settings">
        <div class="titlebar">
            <span>⚙️ Configurações</span>
            <button class="close" onclick="closeWindow('settings')">×</button>
        </div>

        <div class="content">
            <h2>Configurações do PC</h2>
            <br>
            <p>💻 Processador: Virtual CPU</p>
            <br>
            <p>🎮 GPU: NVIDIA RTX 3060 Virtual</p>
            <br>
            <p>🧠 RAM: 16 GB Virtual</p>
            <br>
            <p>💾 Armazenamento: 1 TB Virtual</p>
            <br>
            <p>🖥️ Resolução: 1920 × 1080</p>
        </div>
    </div>

    <!-- START MENU -->
    <div class="start" id="start">
        <h2>Menu Iniciar</h2>

        <div class="app" onclick="openWindow('gpu');toggleStart()">
            🎮 RTX 3060
        </div>

        <div class="app" onclick="openWindow('browser');toggleStart()">
            🌐 Navegador
        </div>

        <div class="app" onclick="openWindow('files');toggleStart()">
            📁 Arquivos
        </div>

        <div class="app" onclick="openWindow('settings');toggleStart()">
            ⚙️ Configurações
        </div>
    </div>

    <!-- TASKBAR -->
    <div class="taskbar">
        <button class="startBtn" onclick="toggleStart()">⊞ Iniciar</button>
        <span>🎮 RTX 3060 Virtual</span>
        <span class="clock" id="clock"></span>
    </div>

</div>

<script>

function openWindow(id){
    document.getElementById(id).style.display="block";
}

function closeWindow(id){
    document.getElementById(id).style.display="none";
}

function toggleStart(){
    const menu=document.getElementById("start");
    menu.style.display =
        menu.style.display==="block" ? "none" : "block";
}

function updateClock(){
    const now=new Date();

    let h=String(now.getHours()).padStart(2,"0");
    let m=String(now.getMinutes()).padStart(2,"0");

    document.getElementById("clock").textContent=
        h+":"+m;
}

setInterval(updateClock,1000);
updateClock();

function benchmark(){

    const gpu=document.getElementById("gpuFill");
    const vram=document.getElementById("vramFill");
    const gpuText=document.getElementById("gpuText");
    const vramText=document.getElementById("vramText");
    const temp=document.getElementById("temp");

    let usage=0;
    let memory=0;

    const timer=setInterval(()=>{

        usage=Math.min(98,usage+Math.random()*20);
        memory=Math.min(95,memory+Math.random()*18);

        gpu.style.width=usage+"%";
        vram.style.width=memory+"%";

        gpuText.textContent=Math.round(usage)+"%";
        vramText.textContent=
            (memory*12/100).toFixed(1)+" / 12 GB";

        temp.textContent=
            Math.round(35+usage*0.45)+"°C";

        if(usage>=98){
            clearInterval(timer);
        }

    },500);
}

function searchWeb(){

    const text=document.getElementById("search").value;

    if(!text)return;

    document.getElementById("browserpage").innerHTML=
        "<h1>🔎 Resultado</h1><br>"+
        "<p>Pesquisa virtual por: <b>"+
        text+
        "</b></p><br>"+
        "<p>Este navegador faz parte da simulação do PC.</p>";
}

</script>

</body>
</html>
